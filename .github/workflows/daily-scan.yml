name: Daily SEPA scan

on:
  schedule:
    # 22:10 UTC = ~6pm ET, after US market close & daily data settles
    - cron: "10 22 * * 1-5"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write          # needed to commit the scan result back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_scan.py sp500
      - name: Commit today's scan
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/scan_history/*.json
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push
